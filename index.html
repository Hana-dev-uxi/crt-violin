<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Retro CRT Violin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    #crt-container {
      position: relative;
      width: 100%;
      height: 80dvh;
      background: #000;
      border: 3px solid #111;
    }

    #crt-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.12) 0px,
        rgba(0,0,0,0.12) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 5;
    }

    #ui-bottom {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      height: 20dvh;
    }

    #status {
      font-size: 9px;
      color: #ffaacc;
      letter-spacing: 1px;
    }

    button {
      background: transparent;
      color: #ffaacc;
      padding: 8px 18px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      border: 1.5px solid #ffaacc;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 1px;
    }

    button:active {
      background: #ffaacc;
      color: #111;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #footer {
      font-size: 7px;
      color: #444;
      font-family: monospace;
    }

    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: #ffaacc;
      font-size: 12px;
      align-items: center;
      justify-content: center;
      z-index: 999;
      text-align: center;
      letter-spacing: 2px;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-prompt { display: flex; }
    }
  </style>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";

    const video    = document.getElementById("webcam");
    const canvas   = document.getElementById("output");
    const ctx      = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("start-btn");

    let audioCtx, gainNode;
    let oscillators = [];
    let handLandmarker;
    let activeStringIdx = -1;
    let pitchMod = 0.5;
    let lastVideoTime = -1;

    const strings = [
      { name: "G3", freq: 196.00, color: "#ff6eb4" },
      { name: "D4", freq: 293.66, color: "#ff9ecc" },
      { name: "A4", freq: 440.00, color: "#ffbdde" },
      { name: "E5", freq: 659.25, color: "#ffd6ec" },
    ];

    const stringNotes = {
      "G3": ["G3","A3","B3","C4","D4","E4","F#4","G4"],
      "D4": ["D4","E4","F#4","G4","A4","B4","C5","D5"],
      "A4": ["A4","B4","C5","D5","E5","F#5","G5","A5"],
      "E5": ["E5","F#5","G5","A5","B5","C6","D6","E6"],
    };

    const freqRatios = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2];

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.6;
      masterGain.connect(audioCtx.destination);

      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;
      gainNode.connect(masterGain);

      oscillators = strings.map((s, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.value = s.freq;

        const gain = audioCtx.createGain();
        gain.gain.value = i === 0 ? 1 : 0.6 - i * 0.08;

        const harm2 = audioCtx.createOscillator();
        harm2.type = "sawtooth";
        harm2.frequency.value = s.freq * 2;
        const gain2 = audioCtx.createGain();
        gain2.gain.value = 0.25;

        const harm3 = audioCtx.createOscillator();
        harm3.type = "sawtooth";
        harm3.frequency.value = s.freq * 3;
        const gain3 = audioCtx.createGain();
        gain3.gain.value = 0.12;

        const harm4 = audioCtx.createOscillator();
        harm4.type = "sawtooth";
        harm4.frequency.value = s.freq * 4;
        const gain4 = audioCtx.createGain();
        gain4.gain.value = 0.06;

        const lp = audioCtx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 2200;
        lp.Q.value = 1.2;

        const hp = audioCtx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 120;

        const formant = audioCtx.createBiquadFilter();
        formant.type = "peaking";
        formant.frequency.value = 800;
        formant.gain.value = 4;
        formant.Q.value = 2;

        harm2.connect(gain2); gain2.connect(lp);
        harm3.connect(gain3); gain3.connect(lp);
        harm4.connect(gain4); gain4.connect(lp);
        osc.connect(gain); gain.connect(lp);
        lp.connect(hp); hp.connect(formant); formant.connect(gainNode);

        osc.start(); harm2.start(); harm3.start(); harm4.start();
        return { osc, harm2, harm3, harm4 };
      });
    }

    function setFrequency(baseFreq, mod) {
      const noteIdx = Math.min(7, Math.floor(mod * 8));
      const ratio   = freqRatios[noteIdx];
      const f       = baseFreq * ratio;

      oscillators.forEach(({ osc, harm2, harm3, harm4 }) => {
        const scale = f / osc.frequency.value;
        osc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.008);
        harm2.frequency.setTargetAtTime(f * 2, audioCtx.currentTime, 0.008);
        harm3.frequency.setTargetAtTime(f * 3, audioCtx.currentTime, 0.008);
        harm4.frequency.setTargetAtTime(f * 4, audioCtx.currentTime, 0.008);
      });

      return { noteIdx, freq: f };
    }

    async function initTracker() {
      statusEl.innerText = "LOADING VISION...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        statusEl.innerText = "READY";
        startCamera();
      } catch {
        statusEl.innerText = "LOAD FAILED";
        startBtn.disabled = false;
      }
    }

    function startCamera() {
      const constraints = {
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };
      navigator.mediaDevices.getUserMedia(constraints)
        .then((stream) => {
          video.srcObject = stream;
          video.muted = true;
          video.playsInline = true;
          video.autoplay = true;
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            statusEl.innerText = "CAMERA READY";
            requestAnimationFrame(predictWebcam);
          };
        })
        .catch(() => {
          statusEl.innerText = "CAM ERROR";
          startBtn.disabled = false;
        });
    }

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function drawOverlay(activeStr, noteIdx, rightX, rightY, leftX, leftY, isPlaying) {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const zoneW = W / 4;

      strings.forEach((s, i) => {
        const x = i * zoneW;
        const isActive = i === activeStr;

        ctx.fillStyle = isActive
          ? `rgba(255,110,180,${isPlaying ? 0.18 : 0.10})`
          : "rgba(255,110,180,0.04)";
        ctx.fillRect(x, 0, zoneW, H);

        if (i > 0) {
          ctx.strokeStyle = isActive ? "rgba(255,110,180,0.8)" : "rgba(255,110,180,0.25)";
          ctx.lineWidth = isActive ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }

        ctx.save();
        ctx.fillStyle = isActive ? "#ff6eb4" : "rgba(255,110,180,0.4)";
        ctx.font = `bold ${isActive ? 14 : 11}px Orbitron, sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(s.name, x + zoneW / 2, 22);
        ctx.restore();

        if (isActive && noteIdx >= 0) {
          const notes = stringNotes[s.name];
          const noteH = H / 8;
          notes.forEach((n, ni) => {
            const ny = H - (ni + 1) * noteH;
            const isActiveNote = ni === noteIdx;
            ctx.save();
            ctx.fillStyle = isActiveNote
              ? "rgba(255,110,180,0.3)"
              : "rgba(255,110,180,0.06)";
            ctx.fillRect(x + 2, ny, zoneW - 4, noteH - 1);

            ctx.fillStyle = isActiveNote ? "#ff6eb4" : "rgba(255,110,180,0.4)";
            ctx.font = `${isActiveNote ? 11 : 9}px Orbitron, sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText(n, x + zoneW / 2, ny + noteH / 2 + 4);

            const ratio = freqRatios[ni];
            ctx.font = "8px monospace";
            ctx.fillStyle = isActiveNote ? "rgba(255,200,220,0.9)" : "rgba(255,180,210,0.3)";
            ctx.fillText(`×${ratio.toFixed(2)}`, x + zoneW / 2, ny + noteH / 2 + 16);
            ctx.restore();
          });
        }
      });

      const yAxisX = 12;
      const gradY = ctx.createLinearGradient(0, 0, 0, H);
      gradY.addColorStop(0, "rgba(255,110,180,0.8)");
      gradY.addColorStop(1, "rgba(255,110,180,0.1)");
      ctx.strokeStyle = gradY;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(yAxisX, 10);
      ctx.lineTo(yAxisX, H - 10);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,110,180,0.7)";
      ctx.font = "8px Orbitron, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("▲", yAxisX, 8);
      ctx.fillText("PITCH", yAxisX + 2, H / 2);
      ctx.fillText("▼", yAxisX, H - 2);

      const xAxisY = H - 14;
      const gradX = ctx.createLinearGradient(0, 0, W, 0);
      gradX.addColorStop(0, "rgba(255,110,180,0.1)");
      gradX.addColorStop(1, "rgba(255,110,180,0.8)");
      ctx.strokeStyle = gradX;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, xAxisY);
      ctx.lineTo(W - 10, xAxisY);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,110,180,0.7)";
      ctx.font = "8px Orbitron, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("◄ G3  D4  A4  E5 ►", W / 2, H - 2);

      if (rightX !== null) {
        const px = rightX * W;
        const py = rightY * H;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, 2 * Math.PI);
        ctx.fillStyle = isPlaying ? "#ff6eb4" : "rgba(255,110,180,0.5)";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "7px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText("R", px, py + 3);
      }

      if (leftX !== null) {
        const px = leftX * W;
        const py = leftY * H;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(255,200,230,0.7)";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "7px Orbitron";
        ctx.textAlign = "center";
        ctx.fillText("L", px, py + 3);

        const barH = (1 - leftY) * (H * 0.8);
        ctx.fillStyle = "rgba(255,110,180,0.25)";
        ctx.fillRect(0, H - barH - 10, 8, barH);
      }
    }

    async function predictWebcam() {
      if (video.readyState < 2) {
        requestAnimationFrame(predictWebcam);
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (video.currentTime !== lastVideoTime && handLandmarker) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        let rightHand = null;
        let leftHand  = null;
        let isPlaying = false;
        let noteIdx   = -1;

        if (results.landmarks && results.landmarks.length > 0) {
          results.landmarks.forEach((hand) => {
            const wristX = hand[0].x;
            if (wristX > 0.5) rightHand = hand;
            else leftHand = hand;
          });

          if (!rightHand) rightHand = results.landmarks[0];

          if (rightHand) {
            const tip = rightHand[8];
            activeStringIdx = Math.min(3, Math.floor(tip.x * 4));
          }

          if (leftHand) {
            const tip   = leftHand[8];
            const thumb = leftHand[4];
            pitchMod  = 1 - tip.y;
            const pinch = dist(tip, thumb);
            isPlaying = pinch < 0.07;
          } else {
            isPlaying = true;
          }

          if (rightHand && audioCtx) {
            const base  = strings[activeStringIdx].freq;
            const r     = setFrequency(base, pitchMod);
            noteIdx     = r.noteIdx;
            gainNode.gain.setTargetAtTime(isPlaying ? 0.35 : 0, audioCtx.currentTime, 0.008);
          }
        } else {
          activeStringIdx = -1;
          if (gainNode && audioCtx) {
            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.008);
          }
        }

        const rTip = rightHand ? rightHand[8] : null;
        const lTip = leftHand  ? leftHand[8]  : null;

        drawOverlay(
          activeStringIdx,
          noteIdx,
          rTip ? rTip.x : null,
          rTip ? rTip.y : null,
          lTip ? lTip.x : null,
          lTip ? lTip.y : null,
          isPlaying
        );
      }
      requestAnimationFrame(predictWebcam);
    }

    startBtn.addEventListener("click", (e) => {
      e.target.disabled = true;
      if (screen.orientation?.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
      initAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      initTracker();
    });
  </script>
</head>
<body>

  <div id="rotate-prompt">ROTATE DEVICE TO LANDSCAPE ↻</div>

  <div id="crt-container">
    <video id="webcam" playsinline muted autoplay></video>
    <canvas id="output"></canvas>
  </div>

  <div id="ui-bottom">
    <div id="status"></div>
    <button id="start-btn">START</button>
    <div id="footer">&copy; &lt;/H&gt;</div>
  </div>

</body>
</html>
