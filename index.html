<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CRT Violin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; font-family: 'Orbitron', sans-serif; }
    #wrap { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #crt { position: relative; flex: 1; background: #000; overflow: hidden; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
    #bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #111; flex-shrink: 0; }
    #status { font-size: 8px; color: #ff9ec8; letter-spacing: 1px; }
    #footer { font-size: 7px; color: #333; font-family: monospace; }
    button { background: transparent; color: #ff9ec8; padding: 6px 14px; font-family: 'Orbitron', sans-serif; font-size: 9px; border: 1px solid #ff9ec8; cursor: pointer; letter-spacing: 1px; }
    button:active { background: #ff9ec8; color: #111; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";

    const video  = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx    = canvas.getContext("2d");
    const statEl = document.getElementById("status");
    const btn    = document.getElementById("start-btn");

    const STRINGS = [
      { name:"G3", freq:196.00 },
      { name:"D4", freq:293.66 },
      { name:"A4", freq:440.00 },
      { name:"E5", freq:659.25 },
    ];
    const RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2];
    const NOTES = {
      "G3":["G3","A3","B3","C4","D4","E4","F#4","G4"],
      "D4":["D4","E4","F#4","G4","A4","B4","C5","D5"],
      "A4":["A4","B4","C5","D5","E5","F#5","G5","A5"],
      "E5":["E5","F#5","G5","A5","B5","C6","D6","E6"],
    };

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17]
    ];

    let audioCtx, osc, h2, h3, gainNode;
    let handLandmarker, lastT = -1, ready = false;

    let curStrIdx = 0;
    let curNoteIdx = 4;
    let curPlaying = false;
    let smoothStr = 0;
    let smoothNote = 4;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2200;
      lp.Q.value = 0.5;

      const formant = audioCtx.createBiquadFilter();
      formant.type = "peaking";
      formant.frequency.value = 650;
      formant.gain.value = 3.5;
      formant.Q.value = 1.2;

      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;

      const master = audioCtx.createGain();
      master.gain.value = 0.13;

      osc = audioCtx.createOscillator(); osc.type = "triangle"; osc.frequency.value = 440;
      h2  = audioCtx.createOscillator(); h2.type  = "sawtooth"; h2.frequency.value  = 880;
      h3  = audioCtx.createOscillator(); h3.type  = "sine";     h3.frequency.value  = 1320;

      const g2 = audioCtx.createGain(); g2.gain.value = 0.15;
      const g3 = audioCtx.createGain(); g3.gain.value = 0.08;

      osc.connect(formant);
      h2.connect(g2); g2.connect(lp);
      h3.connect(g3); g3.connect(lp);
      lp.connect(formant);
      formant.connect(gainNode);
      gainNode.connect(master);
      master.connect(audioCtx.destination);

      osc.start(); h2.start(); h3.start();
    }

    function setFreq(f) {
      const t = audioCtx.currentTime;
      osc.frequency.setTargetAtTime(f,     t, 0.04);
      h2.frequency.setTargetAtTime(f * 2,  t, 0.04);
      h3.frequency.setTargetAtTime(f * 3,  t, 0.04);
    }

    function setGain(on) {
      gainNode.gain.setTargetAtTime(on ? 1 : 0, audioCtx.currentTime, 0.05);
    }

    function isFist(hand) {
      const tips = [8, 12, 16, 20];
      const mcps = [5,  9, 13, 17];
      let folded = 0;
      for (let i = 0; i < 4; i++) {
        if (hand[tips[i]].y > hand[mcps[i]].y) folded++;
      }
      return folded >= 3;
    }

    async function initTracker() {
      statEl.innerText = "LOADING...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.35,
          minHandPresenceConfidence: 0.35,
          minTrackingConfidence: 0.3
        });
        statEl.innerText = "READY";
        startCam();
      } catch {
        statEl.innerText = "FAILED";
        btn.disabled = false;
      }
    }

    function startCam() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode:"user", width:{ideal:320}, height:{ideal:240} }
      }).then(stream => {
        video.srcObject = stream;
        video.muted = true; video.playsInline = true; video.autoplay = true;
        video.onloadedmetadata = () => {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          ready = true;
          statEl.innerText = "LIVE";
          requestAnimationFrame(loop);
        };
      }).catch(() => { statEl.innerText = "CAM ERR"; btn.disabled = false; });
    }

    function drawSkeleton(hand, mirrored, color) {
      const W = canvas.width, H = canvas.height;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;

      HAND_CONNECTIONS.forEach(([a, b]) => {
        const pa = hand[a], pb = hand[b];
        const ax = (mirrored ? 1 - pa.x : pa.x) * W;
        const ay = pa.y * H;
        const bx = (mirrored ? 1 - pb.x : pb.x) * W;
        const by = pb.y * H;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      });

      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      [0,4,8,12,16,20].forEach(i => {
        const p = hand[i];
        const px = (mirrored ? 1 - p.x : p.x) * W;
        const py = p.y * H;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function draw(strIdx, noteIdx, playing, footerY, fistHand, fingerHand) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const zW = W / 4;

      STRINGS.forEach((s, i) => {
        const sx = i * zW;
        const active = i === strIdx;

        ctx.fillStyle = active
          ? (playing ? "rgba(255,110,180,0.16)" : "rgba(255,110,180,0.06)")
          : "rgba(255,110,180,0.02)";
        ctx.fillRect(sx, footerY, zW, H - footerY);

        if (i > 0) {
          ctx.strokeStyle = active ? "rgba(255,110,180,0.7)" : "rgba(255,110,180,0.15)";
          ctx.lineWidth = active ? 1.5 : 0.8;
          ctx.beginPath();
          ctx.moveTo(sx, footerY);
          ctx.lineTo(sx, H);
          ctx.stroke();
        }

        ctx.save();
        ctx.fillStyle = active ? "#ff6eb4" : "rgba(255,110,180,0.35)";
        ctx.font = (active ? "bold 12" : "10") + "px Orbitron";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(s.name, sx + zW / 2, footerY + (H - footerY) / 2);
        ctx.restore();
      });

      ctx.strokeStyle = "rgba(255,110,180,0.6)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, footerY);
      ctx.lineTo(W, footerY);
      ctx.stroke();

      ctx.save();
      ctx.fillStyle = "rgba(255,110,180,0.5)";
      ctx.font = "7px Orbitron";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("PITCH ZONE", 8, 6);
      ctx.restore();

      if (noteIdx >= 0 && strIdx >= 0) {
        const notes = NOTES[STRINGS[strIdx].name];
        const zoneH = footerY;
        const nH = zoneH / 8;
        notes.forEach((n, ni) => {
          const ny = zoneH - (ni + 1) * nH;
          const hot = ni === noteIdx;
          if (hot) {
            ctx.fillStyle = "rgba(255,110,180,0.15)";
            ctx.fillRect(0, ny, W, nH - 1);
          }
          ctx.save();
          ctx.fillStyle = hot ? "#ff6eb4" : "rgba(255,110,180,0.22)";
          ctx.font = (hot ? "bold 11" : "9") + "px Orbitron";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(n, 10, ny + nH / 2);
          ctx.font = "8px monospace";
          ctx.fillStyle = hot ? "rgba(255,210,230,0.9)" : "rgba(255,180,210,0.18)";
          ctx.textAlign = "right";
          ctx.fillText("×" + RATIOS[ni].toFixed(3), W - 10, ny + nH / 2);
          ctx.restore();
        });
      }

      if (fingerHand) drawSkeleton(fingerHand, true, "rgba(255,179,217,0.9)");
      if (fistHand)   drawSkeleton(fistHand, true, "#ff6eb4");
    }

    function loop() {
      if (!ready || video.readyState < 2) { requestAnimationFrame(loop); return; }
      if (video.currentTime === lastT)    { requestAnimationFrame(loop); return; }
      lastT = video.currentTime;

      const res = handLandmarker.detectForVideo(video, performance.now());
      const W = canvas.width, H = canvas.height;
      const footerY = H * 0.32;

      let fistHand = null, fingerHand = null;

      if (res.landmarks?.length > 0) {
        res.landmarks.forEach(hand => {
          if (isFist(hand)) { if (!fistHand) fistHand = hand; }
          else { if (!fingerHand) fingerHand = hand; }
        });
      }

      if (fistHand) {
        const tip = fistHand[9];
        const rx = 1 - tip.x;
        const targetStr = Math.max(0, Math.min(3, Math.floor(rx * 4)));
        smoothStr = lerp(smoothStr, targetStr, 0.35);
        curStrIdx = Math.round(smoothStr);
        curPlaying = true;
      } else {
        curPlaying = false;
      }

      if (fingerHand) {
        const tip = fingerHand[8];
        const py  = tip.y * H;
        if (py < footerY) {
          const pitchMod = Math.max(0, Math.min(1, 1 - (py / footerY)));
          const targetNote = Math.max(0, Math.min(7, Math.floor(pitchMod * 8)));
          smoothNote = lerp(smoothNote, targetNote, 0.35);
          curNoteIdx = Math.round(smoothNote);
        }
      }

      if (audioCtx) {
        const f = STRINGS[curStrIdx].freq * RATIOS[curNoteIdx];
        setFreq(f);
        setGain(curPlaying);
      }

      draw(curStrIdx, curNoteIdx, curPlaying, footerY, fistHand, fingerHand);
      requestAnimationFrame(loop);
    }

    btn.addEventListener("click", e => {
      e.target.disabled = true;
      initAudio();
      audioCtx.resume();
      initTracker();
    });
  </script>
</head>
<body>
  <div id="wrap">
    <div id="crt">
      <video id="webcam" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="bar">
      <span id="status"></span>
      <button id="start-btn">START</button>
      <span id="footer">&copy; &lt;/H&gt;</span>
    </div>
  </div>
</body>
</html>
