<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CRT Violin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    #crt {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111;
      flex-shrink: 0;
    }

    #status {
      font-size: 8px;
      color: #ff9ec8;
      letter-spacing: 1px;
    }

    #footer {
      font-size: 7px;
      color: #333;
      font-family: monospace;
    }

    button {
      background: transparent;
      color: #ff9ec8;
      padding: 6px 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      border: 1px solid #ff9ec8;
      cursor: pointer;
      letter-spacing: 1px;
    }

    button:active { background: #ff9ec8; color: #111; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: #ff9ec8;
      font-size: 11px;
      align-items: center;
      justify-content: center;
      z-index: 999;
      letter-spacing: 3px;
      text-align: center;
    }

    @media (orientation: portrait) and (max-width: 1024px) {
      #rotate-msg { display: flex; }
    }
  </style>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";

    const video   = document.getElementById("webcam");
    const canvas  = document.getElementById("overlay");
    const ctx     = canvas.getContext("2d");
    const statEl  = document.getElementById("status");
    const btn     = document.getElementById("start-btn");

    const STRINGS = [
      { name:"G3", freq:196.00 },
      { name:"D4", freq:293.66 },
      { name:"A4", freq:440.00 },
      { name:"E5", freq:659.25 },
    ];

    const SCALE_RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2];

    const SCALE_NOTES = {
      "G3": ["G3","A3","B3","C4","D4","E4","F#4","G4"],
      "D4": ["D4","E4","F#4","G4","A4","B4","C5","D5"],
      "A4": ["A4","B4","C5","D5","E5","F#5","G5","A5"],
      "E5": ["E5","F#5","G5","A5","B5","C6","D6","E6"],
    };

    let audioCtx, masterGain, stringGains = [], stringOscs = [];
    let handLandmarker;
    let lastT = -1;
    let canvasReady = false;

    let smoothR = { x: null, y: null };
    let smoothL = { x: null, y: null };
    const SMOOTH = 0.25;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function initAudio() {
      audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.18;
      masterGain.connect(audioCtx.destination);

      STRINGS.forEach((s) => {
        const g = audioCtx.createGain();
        g.gain.value = 0;
        g.connect(masterGain);
        stringGains.push(g);

        const lp = audioCtx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 2400;
        lp.Q.value = 0.8;
        lp.connect(g);

        const formant = audioCtx.createBiquadFilter();
        formant.type = "peaking";
        formant.frequency.value = 700;
        formant.gain.value = 5;
        formant.Q.value = 1.5;
        formant.connect(lp);

        const fund = audioCtx.createOscillator();
        fund.type = "sawtooth";
        fund.frequency.value = s.freq;
        fund.connect(formant);

        const h2 = audioCtx.createOscillator();
        h2.type = "sawtooth";
        h2.frequency.value = s.freq * 2;
        const g2 = audioCtx.createGain(); g2.gain.value = 0.3;
        h2.connect(g2); g2.connect(formant);

        const h3 = audioCtx.createOscillator();
        h3.type = "sawtooth";
        h3.frequency.value = s.freq * 3;
        const g3 = audioCtx.createGain(); g3.gain.value = 0.1;
        h3.connect(g3); g3.connect(formant);

        fund.start(); h2.start(); h3.start();
        stringOscs.push({ fund, h2, h3 });
      });
    }

    function setStringNote(strIdx, pitchMod) {
      const noteIdx = Math.min(7, Math.floor(pitchMod * 8));
      const base    = STRINGS[strIdx].freq;
      const f       = base * SCALE_RATIOS[noteIdx];
      const osc     = stringOscs[strIdx];
      const t       = audioCtx.currentTime;
      osc.fund.frequency.setTargetAtTime(f,     t, 0.01);
      osc.h2.frequency.setTargetAtTime(f * 2,   t, 0.01);
      osc.h3.frequency.setTargetAtTime(f * 3,   t, 0.01);
      return noteIdx;
    }

    function setPlay(strIdx, playing) {
      const t = audioCtx.currentTime;
      stringGains.forEach((g, i) => {
        const target = (i === strIdx && playing) ? 1 : 0;
        g.gain.setTargetAtTime(target, t, 0.012);
      });
    }

    async function initTracker() {
      statEl.innerText = "LOADING...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.55,
          minHandPresenceConfidence: 0.55,
          minTrackingConfidence: 0.5
        });
        statEl.innerText = "READY";
        startCam();
      } catch {
        statEl.innerText = "LOAD FAILED";
        btn.disabled = false;
      }
    }

    function startCam() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } }
      }).then(stream => {
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        video.autoplay = true;
        video.onloadedmetadata = () => {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          canvasReady = true;
          statEl.innerText = "LIVE";
          requestAnimationFrame(loop);
        };
      }).catch(() => {
        statEl.innerText = "CAM ERROR";
        btn.disabled = false;
      });
    }

    function dist2d(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function drawDot(x, y, label, bright) {
      const W = canvas.width, H = canvas.height;
      const px = x * W, py = y * H;

      ctx.save();
      ctx.shadowColor = bright ? "#ff6eb4" : "#ffaad4";
      ctx.shadowBlur  = 18;
      ctx.beginPath();
      ctx.arc(px, py, bright ? 9 : 7, 0, Math.PI * 2);
      ctx.fillStyle = bright ? "#ff6eb4" : "rgba(255,170,212,0.7)";
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 8px Orbitron";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, px, py);
      ctx.restore();
    }

    function draw(activeStr, noteIdx, rx, ry, lx, ly, playing) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const zW = W / 4;

      STRINGS.forEach((s, i) => {
        const sx = i * zW;
        const active = i === activeStr;

        if (active) {
          ctx.fillStyle = playing
            ? "rgba(255,110,180,0.15)"
            : "rgba(255,110,180,0.07)";
          ctx.fillRect(sx, 0, zW, H);
        }

        if (i > 0) {
          ctx.strokeStyle = active ? "rgba(255,110,180,0.7)" : "rgba(255,110,180,0.2)";
          ctx.lineWidth   = active ? 1.5 : 0.8;
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx, H);
          ctx.stroke();
        }

        ctx.save();
        ctx.fillStyle   = active ? "#ff6eb4" : "rgba(255,110,180,0.35)";
        ctx.font        = `${active ? "bold 13" : "11"}px Orbitron`;
        ctx.textAlign   = "center";
        ctx.textBaseline = "top";
        ctx.fillText(s.name, sx + zW / 2, 8);
        ctx.restore();

        if (active && noteIdx >= 0) {
          const notes = SCALE_NOTES[s.name];
          const nH    = H / 8;
          notes.forEach((n, ni) => {
            const ny  = H - (ni + 1) * nH;
            const hot = ni === noteIdx;
            if (hot) {
              ctx.fillStyle = "rgba(255,110,180,0.22)";
              ctx.fillRect(sx + 2, ny, zW - 4, nH - 1);
            }
            ctx.save();
            ctx.fillStyle    = hot ? "#ff6eb4" : "rgba(255,110,180,0.3)";
            ctx.font         = `${hot ? "bold 10" : "9"}px Orbitron`;
            ctx.textAlign    = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(n, sx + zW / 2, ny + nH * 0.38);
            ctx.font      = "7px monospace";
            ctx.fillStyle = hot ? "rgba(255,200,225,0.85)" : "rgba(255,180,210,0.25)";
            ctx.fillText(`×${SCALE_RATIOS[ni].toFixed(3)}`, sx + zW / 2, ny + nH * 0.7);
            ctx.restore();
          });
        }
      });

      ctx.save();
      ctx.strokeStyle = "rgba(255,110,180,0.5)";
      ctx.lineWidth   = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(16, 12);
      ctx.lineTo(16, H - 20);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle    = "rgba(255,110,180,0.6)";
      ctx.font         = "7px Orbitron";
      ctx.textAlign    = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("▲", 16, 8);
      ctx.fillText("▼", 16, H - 16);

      if (ly !== null) {
        const barH = (1 - ly) * (H - 40);
        ctx.fillStyle = "rgba(255,110,180,0.3)";
        ctx.fillRect(4, H - 24 - barH, 10, barH);
      }

      ctx.strokeStyle = "rgba(255,110,180,0.5)";
      ctx.beginPath();
      ctx.moveTo(24, H - 16);
      ctx.lineTo(W - 8, H - 16);
      ctx.stroke();
      ctx.fillText("◄", 20, H - 16);
      ctx.fillText("►", W - 8, H - 16);
      ctx.restore();

      if (rx !== null) drawDot(rx, ry, "R", true);
      if (lx !== null) drawDot(lx, ly, "L", false);
    }

    function loop() {
      if (!canvasReady || video.readyState < 2) {
        requestAnimationFrame(loop);
        return;
      }

      if (video.currentTime === lastT) {
        requestAnimationFrame(loop);
        return;
      }
      lastT = video.currentTime;

      const res = handLandmarker.detectForVideo(video, performance.now());

      let rHand = null, lHand = null;

      if (res.landmarks && res.landmarks.length > 0) {
        res.landmarks.forEach(hand => {
          const wx = 1 - hand[0].x;
          if (wx < 0.5) lHand = hand;
          else rHand = hand;
        });
        if (!rHand && !lHand) rHand = res.landmarks[0];
      }

      let activeStr = -1;
      let noteIdx   = -1;
      let playing   = false;

      let rRaw = null, lRaw = null;

      if (rHand) {
        const tip = rHand[8];
        const rx  = 1 - tip.x;
        rRaw = { x: rx, y: tip.y };

        if (smoothR.x === null) smoothR = { x: rx, y: tip.y };
        smoothR.x = lerp(smoothR.x, rx, SMOOTH);
        smoothR.y = lerp(smoothR.y, tip.y, SMOOTH);

        activeStr = Math.min(3, Math.floor(smoothR.x * 4));
      } else {
        smoothR = { x: null, y: null };
      }

      if (lHand) {
        const tip  = lHand[8];
        const lx   = 1 - tip.x;
        lRaw = { x: lx, y: tip.y };

        if (smoothL.x === null) smoothL = { x: lx, y: tip.y };
        smoothL.x = lerp(smoothL.x, lx, SMOOTH);
        smoothL.y = lerp(smoothL.y, tip.y, SMOOTH);

        const thumb  = lHand[4];
        const pinch  = dist2d(tip, thumb);
        playing  = pinch < 0.07;

        if (activeStr >= 0) {
          const pitchMod = 1 - smoothL.y;
          noteIdx = setStringNote(activeStr, pitchMod);
        }
      } else {
        smoothL = { x: null, y: null };
        playing = rHand !== null;
        if (activeStr >= 0) {
          noteIdx = setStringNote(activeStr, 0.5);
        }
      }

      if (audioCtx) setPlay(activeStr, playing);

      draw(
        activeStr, noteIdx,
        smoothR.x, smoothR.y,
        smoothL.x, smoothL.y,
        playing
      );

      requestAnimationFrame(loop);
    }

    btn.addEventListener("click", e => {
      e.target.disabled = true;
      if (screen.orientation?.lock) screen.orientation.lock("landscape").catch(() => {});
      initAudio();
      audioCtx.resume();
      initTracker();
    });
  </script>
</head>
<body>

  <div id="rotate-msg">ROTATE TO LANDSCAPE ↻</div>

  <div id="wrap">
    <div id="crt">
      <video id="webcam" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="bar">
      <span id="status"></span>
      <button id="start-btn">START</button>
      <span id="footer">&copy; &lt;/H&gt;</span>
    </div>
  </div>

</body>
</html>
