<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CRT Violin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; font-family: 'Orbitron', sans-serif; }
    #wrap { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #crt { position: relative; flex: 1; background: #000; overflow: hidden; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
    #bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #111; flex-shrink: 0; }
    #status { font-size: 8px; color: #ff9ec8; letter-spacing: 1px; }
    #footer { font-size: 7px; color: #333; font-family: monospace; }
    button { background: transparent; color: #ff9ec8; padding: 6px 14px; font-family: 'Orbitron', sans-serif; font-size: 9px; border: 1px solid #ff9ec8; cursor: pointer; letter-spacing: 1px; }
    button:active { background: #ff9ec8; color: #111; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";

    const video  = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx    = canvas.getContext("2d");
    const statEl = document.getElementById("status");
    const btn    = document.getElementById("start-btn");

    const STRINGS = [
      { name:"G3", freq:196.00 },
      { name:"D4", freq:293.66 },
      { name:"A4", freq:440.00 },
      { name:"E5", freq:659.25 },
    ];
    const RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2];
    const NOTES = {
      "G3":["G3","A3","B3","C4","D4","E4","F#4","G4"],
      "D4":["D4","E4","F#4","G4","A4","B4","C5","D5"],
      "A4":["A4","B4","C5","D5","E5","F#5","G5","A5"],
      "E5":["E5","F#5","G5","A5","B5","C6","D6","E6"],
    };

    let audioCtx, osc, h2, h3, gainNode;
    let handLandmarker, lastT = -1, ready = false;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2800;
      lp.Q.value = 0.6;

      const formant = audioCtx.createBiquadFilter();
      formant.type = "peaking";
      formant.frequency.value = 750;
      formant.gain.value = 6;
      formant.Q.value = 1.8;

      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0;

      const master = audioCtx.createGain();
      master.gain.value = 0.15;

      osc = audioCtx.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = 440;
      h2  = audioCtx.createOscillator(); h2.type  = "sawtooth"; h2.frequency.value  = 880;
      h3  = audioCtx.createOscillator(); h3.type  = "sawtooth"; h3.frequency.value  = 1320;

      const g2 = audioCtx.createGain(); g2.gain.value = 0.28;
      const g3 = audioCtx.createGain(); g3.gain.value = 0.10;

      osc.connect(formant);
      h2.connect(g2); g2.connect(lp);
      h3.connect(g3); g3.connect(lp);
      lp.connect(formant);
      formant.connect(gainNode);
      gainNode.connect(master);
      master.connect(audioCtx.destination);

      osc.start(); h2.start(); h3.start();
    }

    function setFreq(f) {
      const t = audioCtx.currentTime;
      osc.frequency.setTargetAtTime(f,     t, 0.015);
      h2.frequency.setTargetAtTime(f * 2,  t, 0.015);
      h3.frequency.setTargetAtTime(f * 3,  t, 0.015);
    }

    function setGain(on) {
      gainNode.gain.setTargetAtTime(on ? 1 : 0, audioCtx.currentTime, 0.018);
    }

    function isFist(hand) {
      const tips   = [8, 12, 16, 20];
      const mcps   = [5,  9, 13, 17];
      let folded = 0;
      for (let i = 0; i < 4; i++) {
        if (hand[tips[i]].y > hand[mcps[i]].y) folded++;
      }
      return folded >= 3;
    }

    async function initTracker() {
      statEl.innerText = "LOADING...";
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.45
        });
        statEl.innerText = "READY";
        startCam();
      } catch {
        statEl.innerText = "FAILED";
        btn.disabled = false;
      }
    }

    function startCam() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode:"user", width:{ideal:320}, height:{ideal:240} }
      }).then(stream => {
        video.srcObject = stream;
        video.muted = true; video.playsInline = true; video.autoplay = true;
        video.onloadedmetadata = () => {
          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          ready = true;
          statEl.innerText = "LIVE";
          requestAnimationFrame(loop);
        };
      }).catch(() => { statEl.innerText = "CAM ERR"; btn.disabled = false; });
    }

    function drawGlow(x, y, label, color) {
      const W = canvas.width, H = canvas.height;
      const px = x * W, py = y * H;
      ctx.save();
      ctx.shadowColor = color; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 8px Orbitron";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, px, py);
      ctx.restore();
    }

    function draw(strIdx, noteIdx, rx, ry, lx, ly, playing) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const zW = W / 4;

      STRINGS.forEach((s, i) => {
        const sx = i * zW;
        const active = i === strIdx;
        if (active) {
          ctx.fillStyle = playing ? "rgba(255,110,180,0.18)" : "rgba(255,110,180,0.08)";
          ctx.fillRect(sx, 0, zW, H);
        }
        if (i > 0) {
          ctx.strokeStyle = active ? "rgba(255,110,180,0.75)" : "rgba(255,110,180,0.18)";
          ctx.lineWidth = active ? 1.5 : 0.8;
          ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
        }
        ctx.save();
        ctx.fillStyle = active ? "#ff6eb4" : "rgba(255,110,180,0.3)";
        ctx.font = (active ? "bold 13" : "11") + "px Orbitron";
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillText(s.name, sx + zW / 2, 8);
        ctx.restore();

        if (active && noteIdx >= 0) {
          const notes = NOTES[s.name];
          const nH = H / 8;
          notes.forEach((n, ni) => {
            const ny  = H - (ni + 1) * nH;
            const hot = ni === noteIdx;
            if (hot) { ctx.fillStyle = "rgba(255,110,180,0.22)"; ctx.fillRect(sx+2, ny, zW-4, nH-1); }
            ctx.save();
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillStyle = hot ? "#ff6eb4" : "rgba(255,110,180,0.28)";
            ctx.font = (hot ? "bold 10" : "9") + "px Orbitron";
            ctx.fillText(n, sx + zW/2, ny + nH*0.38);
            ctx.font = "7px monospace";
            ctx.fillStyle = hot ? "rgba(255,210,230,0.9)" : "rgba(255,180,210,0.2)";
            ctx.fillText("×" + RATIOS[ni].toFixed(3), sx + zW/2, ny + nH*0.72);
            ctx.restore();
          });
        }
      });

      ctx.save();
      ctx.strokeStyle = "rgba(255,110,180,0.4)";
      ctx.lineWidth = 1; ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.moveTo(14, 14); ctx.lineTo(14, H-22); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,110,180,0.55)";
      ctx.font = "7px Orbitron"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("▲", 14, 10); ctx.fillText("▼", 14, H-14);

      if (ly !== null) {
        const bH = (1 - ly) * (H - 44);
        ctx.fillStyle = "rgba(255,110,180,0.28)";
        ctx.fillRect(4, H - 28 - bH, 8, bH);
      }

      ctx.strokeStyle = "rgba(255,110,180,0.4)";
      ctx.beginPath(); ctx.moveTo(22, H-18); ctx.lineTo(W-10, H-18); ctx.stroke();
      ctx.fillText("◄", 18, H-18); ctx.fillText("►", W-8, H-18);
      ctx.restore();

      if (rx !== null) drawGlow(rx, ry, "✊", "#ff6eb4");
      if (lx !== null) drawGlow(lx, ly, "☝", "#ffb3d9");
    }

    function loop() {
      if (!ready || video.readyState < 2) { requestAnimationFrame(loop); return; }
      if (video.currentTime === lastT)    { requestAnimationFrame(loop); return; }
      lastT = video.currentTime;

      const res = handLandmarker.detectForVideo(video, performance.now());

      let fistHand = null, fingerHand = null;

      if (res.landmarks?.length > 0) {
        res.landmarks.forEach(hand => {
          if (isFist(hand)) fistHand   = hand;
          else              fingerHand = hand;
        });
        if (res.landmarks.length === 1) {
          if (isFist(res.landmarks[0])) fistHand   = res.landmarks[0];
          else                          fingerHand = res.landmarks[0];
        }
      }

      let strIdx = -1, noteIdx = -1, playing = false;
      let rx = null, ry = null, lx = null, ly = null;

      if (fistHand) {
        const tip = fistHand[9];
        rx = 1 - tip.x; ry = tip.y;
        strIdx = Math.min(3, Math.floor(rx * 4));
        playing = true;
      }

      if (fingerHand) {
        const tip = fingerHand[8];
        lx = 1 - tip.x; ly = tip.y;
        const pitchMod = Math.max(0, Math.min(1, 1 - ly));
        noteIdx = Math.min(7, Math.floor(pitchMod * 8));
      }

      if (audioCtx) {
        if (strIdx >= 0 && noteIdx >= 0) {
          setFreq(STRINGS[strIdx].freq * RATIOS[noteIdx]);
          setGain(playing);
        } else if (strIdx >= 0) {
          setFreq(STRINGS[strIdx].freq);
          setGain(playing);
        } else {
          setGain(false);
        }
      }

      draw(strIdx, noteIdx, rx, ry, lx, ly, playing);
      requestAnimationFrame(loop);
    }

    btn.addEventListener("click", e => {
      e.target.disabled = true;
      initAudio();
      audioCtx.resume();
      initTracker();
    });
  </script>
</head>
<body>
  <div id="wrap">
    <div id="crt">
      <video id="webcam" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="bar">
      <span id="status"></span>
      <button id="start-btn">START</button>
      <span id="footer">&copy; &lt;/H&gt;</span>
    </div>
  </div>
</body>
</html>
